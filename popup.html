<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kick Stream Notifier</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="container">

    <!-- トップバー -->
    <header class="topbar">
      <div class="topbar-logo">
        <img src="icons/icon48.png" class="logo" alt="Kick" />
        <span class="logo-text">Kick</span>
      </div>
      <div class="topbar-actions">
        <button class="topbar-btn" id="syncFollowsBtn" title="フォロー中を同期">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M1 4v6h6"/><path d="M23 20v-6h-6"/>
            <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"/>
          </svg>
          <span>同期</span>
        </button>
        <button class="topbar-btn" id="checkNowBtn" title="今すぐ更新">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <polyline points="23 4 23 10 17 10"/>
            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
          </svg>
          <span>更新</span>
        </button>
        <button class="topbar-btn topbar-btn-icon" id="settingsBtn" title="設定">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- 設定パネル（折りたたみ） -->
    <div id="settingsPanel" class="settings-panel hidden">
      <div class="settings-inner">
        <!-- ログイン前 -->
        <div id="loginForm">
          <div class="settings-row">
            <span class="settings-label">Kick 連携</span>
            <span class="settings-desc">ログインすると自動同期が可能になります</span>
          </div>
          <div class="auth-inputs">
            <input type="text" id="clientIdInput" placeholder="Client ID" autocomplete="off" spellcheck="false" />
            <input type="password" id="clientSecretInput" placeholder="Client Secret（任意）" autocomplete="off" />
          </div>
          <button id="loginBtn" class="btn btn-kick">Kick にログイン</button>
          <p class="auth-hint">
            <a href="https://kick.com/developer/applications" target="_blank">kick.com/developer/applications</a>
            でアプリを作成
          </p>
        </div>

        <!-- ログイン後 -->
        <div id="loginStatus" class="hidden">
          <div class="auth-user">
            <img id="authAvatar" class="auth-avatar" src="icons/icon48.png" alt="" />
            <div class="auth-user-info">
              <span class="auth-username" id="authUsername">—</span>
              <span class="auth-connected">✓ Kick 連携済み</span>
            </div>
            <button id="logoutBtn" class="btn btn-secondary btn-sm">解除</button>
          </div>
        </div>

        <p id="loginError" class="error-msg hidden"></p>
      </div>
    </div>

    <!-- タブバー -->
    <div class="tab-bar">
      <span class="tab-label">フォロー中</span>
      <span id="liveCount" class="live-count hidden"></span>
    </div>

    <!-- ストリーマーリスト -->
    <ul id="streamerList" class="streamer-list">
      <li class="empty-state" id="emptyState">
        「同期」ボタンでフォロー中を取得してください
      </li>
    </ul>

    <p id="errorMsg" class="error-msg hidden"></p>

  </div>
  <script src="popup.js"></script>
</body>
</html>
